name: Deploy to Server

on:
  workflow_call:
    inputs:
      server_host:
        type: string
        required: false
        default: "82.146.48.183"
      server_port:
        type: string
        required: false
        default: "22"
      deploy_path:
        type: string
        required: false
        default: "sportnis"
      web_port:
        type: string
        required: false
        default: "8082"
    secrets:
      DOCKER_HUB_LOGIN:
        required: true
      DOCKER_HUB_TOKEN:
        required: true
      SERVER_USER:
        required: true
      SERVER_PASSWORD:
        required: true
      POSTGRES_PASSWORD:
        required: true
      APP_JWT_SECRET:
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload prod compose
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ inputs.server_host }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ inputs.server_port }}
          source: "docker-compose.prod.yml"
          target: ${{ inputs.deploy_path }}

      - name: Deploy
        uses: appleboy/ssh-action@v1.0.3
        env:
          DOCKER_HUB_LOGIN: ${{ secrets.DOCKER_HUB_LOGIN }}
          DOCKER_HUB_TOKEN: ${{ secrets.DOCKER_HUB_TOKEN }}
          SUDO_PASS: ${{ secrets.SERVER_PASSWORD }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          APP_JWT_SECRET: ${{ secrets.APP_JWT_SECRET }}
          WEB_PORT: ${{ inputs.web_port }}
        with:
          host: ${{ inputs.server_host }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ inputs.server_port }}
          envs: DOCKER_HUB_LOGIN,DOCKER_HUB_TOKEN,SUDO_PASS,POSTGRES_PASSWORD,APP_JWT_SECRET,WEB_PORT
          script: |
            set -e

            DEPLOY_DIR=~/${{ inputs.deploy_path }}
            cd "$DEPLOY_DIR"

            # Прод-переменные для docker compose.
            cat > .env <<EOF
            DOCKERHUB_USER=${DOCKER_HUB_LOGIN}
            IMAGE_TAG=latest
            POSTGRES_USER=postgres
            POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
            APP_JWT_SECRET=${APP_JWT_SECRET}
            WEB_PORT=${WEB_PORT:-8082}
            EOF

            # Логин в Docker Hub (через sudo, т.к. docker под root).
            echo "$SUDO_PASS" | sudo -S env DH_TOKEN="$DOCKER_HUB_TOKEN" DH_USER="$DOCKER_HUB_LOGIN" \
              sh -c 'echo "$DH_TOKEN" | docker login -u "$DH_USER" --password-stdin'

            if docker compose version >/dev/null 2>&1; then
              DC="docker compose"
            else
              DC="docker-compose"
            fi
            echo "$SUDO_PASS" | sudo -S $DC -f docker-compose.prod.yml --env-file .env pull
            echo "$SUDO_PASS" | sudo -S $DC -f docker-compose.prod.yml --env-file .env up -d
            echo "$SUDO_PASS" | sudo -S docker image prune -f
